version: "3.8"

services:
  web:
    build: .
    image: docker-web
    container_name: web
    ports:
      - "5000:5000"
    networks:
      - devops_network
    volumes:
      - ./app.py:/app/app.py:ro
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - devops_network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

networks:
  devops_network:
    name: devops_network
    driver: bridge
